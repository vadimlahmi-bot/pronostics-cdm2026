<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronostics CdM 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f5f5f5;--bg3:#eee;--text:#1a1a1a;--text2:#666;--text3:#999;--border:#e0e0e0;--border2:#ccc;--orange:#E87722;--success-bg:#E8F5E9;--success:#2E7D32;--danger-bg:#FFEBEE;--danger:#C62828;--warning-bg:#FFF8E1;--warning:#F57F17;--info-bg:#E3F2FD;--info:#1565C0;--radius:12px;--radius-sm:8px}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;--text:#f0f0f0;--text2:#aaa;--text3:#666;--border:#333;--border2:#444}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg2);color:var(--text);font-size:15px;min-height:100vh}
.app{max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
.header{background:var(--orange);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.header-sub{font-size:12px;opacity:.85}
.sync-indicator{width:8px;height:8px;border-radius:50%;background:#fff;opacity:.5}
.sync-indicator.live{opacity:1;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:54px;z-index:9}
.tab{flex:1;padding:10px 2px;font-size:12px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
.tab i{font-size:18px}.tab.active{color:var(--orange);border-bottom-color:var(--orange)}
.content{flex:1;padding:16px}.section{display:none}.section.active{display:block}
.player-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pcard{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius);padding:12px}
.pcard-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.av-v{background:#EEEDFE;color:#3C3489}.av-e{background:#E1F5EE;color:#085041}.av-s{background:#FAEEDA;color:#633806}.av-d{background:#FAECE7;color:#712B13}
.pname{font-size:14px;font-weight:600}.pstatus{font-size:11px;color:var(--text2)}
.br-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.br-label{font-size:11px;color:var(--text2)}.br-val{font-size:21px;font-weight:700}
.mise-pill{font-size:11px;background:var(--bg2);border-radius:20px;padding:2px 8px;color:var(--text2)}
.bar-bg{height:4px;background:var(--bg3);border-radius:2px;margin-top:8px}
.bar-fg{height:4px;border-radius:2px;transition:width .4s}
.dot-today{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2E7D32;margin-left:5px;vertical-align:middle}
.oubli-badge{display:inline-block;font-size:10px;background:var(--danger-bg);color:var(--danger);border-radius:4px;padding:1px 5px;margin-left:3px}
.info-banner{background:var(--info-bg);border:.5px solid #90CAF9;border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;color:var(--info);margin-bottom:12px}
.label{font-size:12px;color:var(--text2);display:block;margin-bottom:5px;margin-top:12px}
input[type=text],input[type=number],select{width:100%;padding:10px 12px;font-size:14px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--orange)}
.hint{font-size:11px;color:var(--text3);margin-top:4px}
.warn{font-size:12px;color:var(--danger);margin-top:6px;display:none}
.btn{width:100%;padding:12px;font-size:15px;font-weight:600;cursor:pointer;border-radius:var(--radius-sm);font-family:inherit;margin-top:14px}
.btn-primary{background:var(--orange);color:#fff;border:none}.btn-secondary{background:none;border:1px solid var(--border2);color:var(--text)}
.btn-sm{padding:7px;font-size:13px;font-weight:500;cursor:pointer;border-radius:var(--radius-sm);font-family:inherit;flex:1}
.btn-win{background:var(--success-bg);color:var(--success);border:.5px solid #A5D6A7}
.btn-lose{background:var(--danger-bg);color:var(--danger);border:.5px solid #EF9A9A}
.pari-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px}
.pari-top{display:flex;justify-content:space-between;align-items:center}
.pari-player{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.pari-cote{font-size:13px;color:var(--text2)}.pari-desc{font-size:12px;color:var(--text2);margin-top:4px}
.pari-gain{font-size:11px;color:var(--text3);margin-top:3px}
.pari-sanction-info{font-size:11px;color:var(--warning);background:var(--warning-bg);border-radius:4px;padding:4px 8px;margin-top:6px}
.pari-actions{display:flex;gap:6px;margin-top:10px}
.chip{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600}
.chip-won{background:var(--success-bg);color:var(--success)}.chip-lost{background:var(--danger-bg);color:var(--danger)}.chip-sanction{background:var(--warning-bg);color:var(--warning)}
.hist-row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:.5px solid var(--border)}
.hist-row:last-child{border-bottom:none}.hist-left{flex:1}.hist-name{font-size:13px;font-weight:600}
.hist-detail{font-size:12px;color:var(--text2);margin-top:2px}.hist-right{text-align:right;flex-shrink:0;margin-left:10px}
.hist-delta{font-size:12px;font-weight:600;margin-top:3px}.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px}
.sanction-section{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.loading{text-align:center;padding:40px;color:var(--text2)}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--border2);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}.modal{background:var(--bg);border-radius:var(--radius);padding:20px;width:100%;max-width:340px}
.modal-title{font-size:17px;font-weight:700;margin-bottom:10px}.modal-body{font-size:14px;color:var(--text2);line-height:1.6}
.modal-box{background:var(--bg2);border-radius:var(--radius-sm);padding:12px;margin-top:10px;font-size:13px}
.modal-box div{margin-bottom:6px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:var(--radius);font-size:13px;display:none;z-index:200;white-space:nowrap}
.cote-info{font-size:11px;color:var(--info);background:var(--info-bg);border-radius:4px;padding:4px 8px;margin-top:4px;display:none}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-top:12px}
.checkbox-row input{width:auto}.checkbox-row label{font-size:14px;color:var(--text);cursor:pointer}
</style>
</head>
<body>
<div class="app">
<div class="header"><div><div style="font-size:17px;font-weight:600">&#x26BD; Pronostics CdM 2026</div><div class="header-sub">Vadim &middot; Erwin &middot; Simon &middot; David</div></div><div class="sync-indicator" id="syncDot"></div></div>
<div class="tabs">
<button class="tab active" onclick="switchTab('dashboard')"><i class="ti ti-layout-dashboard"></i>Tableau</button>
<button class="tab" onclick="switchTab('paris')"><i class="ti ti-ticket"></i>Paris</button>
<button class="tab" onclick="switchTab('saisir')"><i class="ti ti-plus"></i>Saisir</button>
<button class="tab" onclick="switchTab('historique')"><i class="ti ti-history"></i>Historique</button>
</div>
<div class="content">
<div id="tab-dashboard" class="section active"><div id="loadingDash" class="loading"><div class="spinner"></div><br>Chargement...</div><div id="playerCards" class="player-grid" style="display:none"></div><div id="pendingBanner"></div></div>
<div id="tab-paris" class="section"><div id="parisList"></div></div>
<div id="tab-saisir" class="section">
<label class="label">Joueur</label><select id="s-player" onchange="onPlayerChange()"></select>
<div id="s-alreadybet" style="font-size:12px;color:var(--warning);background:var(--warning-bg);border-radius:var(--radius-sm);padding:8px 10px;margin-top:8px;display:none"></div>
<label class="label">Description</label><input type="text" id="s-desc" placeholder="ex: France gagne + Mbapp&eacute; buteur"/>
<label class="label">Cote</label><input type="number" id="s-cote" placeholder="ex: 2.50" step="0.01" min="1.01" oninput="updateCoteInfo()"/>
<div class="cote-info" id="s-coteinfo"></div>
<div id="s-mise-group"><label class="label">Mise (&euro;)</label><input type="number" id="s-mise" placeholder="ex: 15" step="1" min="1"/><div class="hint" id="s-miseinfo"></div></div>
<div class="checkbox-row"><input type="checkbox" id="s-sanction" onchange="onSanctionChange()"/><label for="s-sanction">Ticket de sanction (5&euro; fixe)</label></div>
<div id="s-sanctionner-group" style="display:none"><label class="label">Gains vers&eacute;s &agrave;</label><select id="s-sanctionner"></select></div>
<div class="warn" id="s-warning"></div>
<button class="btn btn-primary" onclick="declarerPari()">D&eacute;clarer le pari</button>
<div class="sanction-section"><div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em">Signaler un oubli</div><label class="label" style="margin-top:0">Joueur fautif</label><select id="s-oubli"></select><button class="btn btn-secondary" onclick="signalerOubli()" style="margin-top:10px">Signaler l'oubli</button></div>
</div>
<div id="tab-historique" class="section"><div id="historiqueList"></div></div>
</div>
</div>
<div class="modal-overlay" id="modal"><div class="modal"><div class="modal-title" id="modal-title"></div><div class="modal-body" id="modal-body"></div><div class="modal-box" id="modal-box" style="display:none"></div><button class="btn btn-primary" onclick="closeModal()" style="margin-top:14px">OK</button></div></div>
<div class="toast" id="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc,onSnapshot,collection,addDoc,updateDoc,query,orderBy}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyBizGflMpcryMSGTNLdlhC1cDpq1cBM7Tk",authDomain:"pronostics-cdm2026-4f297.firebaseapp.com",projectId:"pronostics-cdm2026-4f297",storageBucket:"pronostics-cdm2026-4f297.firebasestorage.app",messagingSenderId:"178484979477",appId:"1:178484979477:web:34770c446003612d17ab1c"}));
const PL=[{id:'vadim',name:'Vadim',av:'V',ac:'av-v'},{id:'erwin',name:'Erwin',av:'E',ac:'av-e'},{id:'simon',name:'Simon',av:'S',ac:'av-s'},{id:'david',name:'David',av:'D',ac:'av-d'}];
let S={bankrolls:{vadim:50,erwin:50,simon:50,david:50},oublis:{vadim:0,erwin:0,simon:0,david:0}},paris=[];
const TD=()=>new Date().toISOString().slice(0,10),mm=br=>br<=0?0:Math.ceil(br*.2),gp=id=>PL.find(p=>p.id===id),eli=id=>S.bankrolls[id]<=0;
const tb=pid=>paris.filter(p=>p.playerId===pid&&p.date===TD()),hn=pid=>tb(pid).some(p=>!p.isSanction&&p.status==='pending'),hs=pid=>tb(pid).some(p=>p.isSanction&&p.status==='pending');
const sR=doc(db,'game','state'),pR=collection(db,'paris');
async function init(){const s=await getDoc(sR);if(!s.exists())await setDoc(sR,S);}
onSnapshot(sR,s=>{if(s.exists()){S=s.data();document.getElementById('syncDot').classList.add('live');ra();}});
onSnapshot(query(pR,orderBy('createdAt','asc')),s=>{paris=s.docs.map(d=>({id:d.id,...d.data()}));ra();document.getElementById('loadingDash').style.display='none';document.getElementById('playerCards').style.display='grid';});
function ra(){rd();rp();rh();ps();}
function rd(){
  const sorted=[...PL].sort((a,b)=>S.bankrolls[b.id]-S.bankrolls[a.id]);let h='';
  sorted.forEach(p=>{const br=S.bankrolls[p.id],m=mm(br),el=eli(p.id),pct=Math.min(100,Math.max(0,(br/100)*100)),bc=el?'#E24B4A':br>=50?'#1D9E75':'#EF9F27',o=S.oublis[p.id];
  h+='<div class="pcard"><div class="pcard-head"><div class="av '+p.ac+'">'+p.av+'</div><div><div class="pname">'+p.name+(o>0?'<span class="oubli-badge">×'+o+'</span>':'')+(hn(p.id)?'<span class="dot-today"></span>':'')+'</div><div class="pstatus">'+(el?'Éliminé':hn(p.id)?'A parié':'En attente')+'</div></div></div><div class="br-row"><span class="br-label">Bankroll</span><span class="br-val">'+br.toFixed(2)+'€</span></div><div class="br-row"><span class="br-label">Mise min.</span><span class="mise-pill">'+(el?'—':m+'€')+'</span></div><div class="bar-bg"><div class="bar-fg" style="width:'+pct+'%;background:'+bc+'"></div></div></div>';});
  document.getElementById('playerCards').innerHTML=h;
  const pend=paris.filter(p=>p.status==='pending');
  document.getElementById('pendingBanner').innerHTML=pend.length?'<div class="info-banner">'+pend.length+' pari(s) en attente → onglet <strong>Paris</strong></div>':'';
}
function rp(){
  const pend=paris.filter(p=>p.status==='pending');
  if(!pend.length){document.getElementById('parisList').innerHTML='<div class="empty">Aucun pari en attente</div>';return;}
  let h='';pend.forEach(p=>{const pl=gp(p.playerId),gn=(p.mise*(p.cote-1)).toFixed(2);
  h+='<div class="pari-card"><div class="pari-top"><div class="pari-player"><div class="av '+pl.ac+'" style="width:22px;height:22px;font-size:10px">'+pl.av+'</div>'+pl.name+(p.isSanction?' <span class="chip chip-sanction">sanction</span>':'')+'</div><span class="pari-cote">'+p.mise+'€ @ '+p.cote+'</span></div><div class="pari-desc">'+p.desc+'</div><div class="pari-gain">Gain net : +'+gn+'€</div>'+(p.isSanction&&p.sanctionnerId?'<div class="pari-sanction-info">Si gagné → '+gp(p.sanctionnerId).name+' encaisse +'+gn+'€ · '+pl.name+' récupère 5€</div>':'')+'<div class="pari-actions"><button class="btn-sm btn-win" onclick="rP(''+p.id+'','won')">✓ Gagné</button><button class="btn-sm btn-lose" onclick="rP(''+p.id+'','lost')">✗ Perdu</button></div></div>';});
  document.getElementById('parisList').innerHTML=h;
}
function rh(){
  const done=paris.filter(p=>p.status!=='pending').reverse();
  if(!done.length){document.getElementById('historiqueList').innerHTML='<div class="empty">Aucun résultat encore</div>';return;}
  let h='';done.forEach(p=>{const pl=gp(p.playerId),gn=(p.mise*(p.cote-1)).toFixed(2);let d='',ex='';
  if(p.isSanction){if(p.status==='won'){d='Mise récupérée';ex='<div class="hist-delta" style="color:var(--success);font-size:11px">'+gp(p.sanctionnerId)?.name+' +'+gn+'€</div>';}else d='-5€';}
  else d=p.status==='won'?'+'+gn+'€':'-'+p.mise+'€';
  h+='<div class="hist-row"><div class="hist-left"><div class="hist-name">'+pl.name+(p.isSanction?' <span class="chip chip-sanction">sanction</span>':'')+'</div><div class="hist-detail">'+p.desc+' · '+p.mise+'€ @ '+p.cote+'</div></div><div class="hist-right"><span class="chip '+(p.status==='won'?'chip-won':'chip-lost')+'">'+(p.status==='won'?'Gagné':'Perdu')+'</span><div class="hist-delta" style="color:var(--(p.status==='won'?'success':'danger'))">'+d+'</div>'+ex+'</div></div>';});
  document.getElementById('historiqueList').innerHTML=h;
}
function ps(){['s-player','s-oubli'].forEach(sid=>{const sel=document.getElementById(sid),cur=sel.value;sel.innerHTML='';PL.forEach(p=>{if(!eli(p.id)){const o=document.createElement('option');o.value=p.id;o.textContent=p.name;sel.appendChild(o);}});if(cur)sel.value=cur;});umi();}
function umi(){const pid=document.getElementById('s-player').value;if(!pid)return;const br=S.bankrolls[pid];document.getElementById('s-miseinfo').textContent='BR : '+br.toFixed(2)+'€ — mise min : '+mm(br)+'€';const is=document.getElementById('s-sanction').checked,ab=document.getElementById('s-alreadybet');if(hn(pid)&&!is){ab.style.display='block';ab.textContent=gp(pid).name+' a déjà son ticket du jour.';}else ab.style.display='none';}
function oPC(){umi();uCI();const pid=document.getElementById('s-player').value;if(document.getElementById('s-sanction').checked)pSn(pid);}
function oSC(){const is=document.getElementById('s-sanction').checked;document.getElementById('s-sanctionner-group').style.display=is?'block':'none';document.getElementById('s-mise-group').style.opacity=is?'0.4':'1';const pid=document.getElementById('s-player').value;if(is&&pid)pSn(pid);umi();uCI();}
window.onSanctionChange=oSC;window.onPlayerChange=oPC;
function uCI(){const is=document.getElementById('s-sanction').checked,cote=parseFloat(document.getElementById('s-cote').value),info=document.getElementById('s-coteinfo');if(!is||isNaN(cote)||cote<=1){info.style.display='none';return;}info.style.display='block';info.textContent='Si gagné → gain net transféré : '+(5*(cote-1)).toFixed(2)+'€';}
window.updateCoteInfo=uCI;
function pSn(excl){const sel=document.getElementById('s-sanctionner');sel.innerHTML='';PL.forEach(p=>{if(p.id!==excl&&!eli(p.id)){const o=document.createElement('option');o.value=p.id;o.textContent=p.name;sel.appendChild(o);}});}
async function dP(){
  const pid=document.getElementById('s-player').value,desc=document.getElementById('s-desc').value.trim(),cote=parseFloat(document.getElementById('s-cote').value),is=document.getElementById('s-sanction').checked,mise=is?5:parseFloat(document.getElementById('s-mise').value),sId=is?document.getElementById('s-sanctionner').value:null,w=document.getElementById('s-warning');
  const sw=msg=>{w.style.display='block';w.textContent=msg;};w.style.display='none';
  if(!desc||isNaN(cote)||(isNaN(mise)&&!is)){sw('Merci de remplir tous les champs.');return;}
  if(cote<=1){sw('La cote doit être > 1.');return;}
  if(!is&&hn(pid)){sw(gp(pid).name+' a déjà un ticket normal aujourd'hui.');return;}
  if(is&&hs(pid)){sw(gp(pid).name+' a déjà un ticket de sanction aujourd'hui.');return;}
  const br=S.bankrolls[pid],m=mm(br);
  if(!is&&mise<m){sw('Mise trop faible. Minimum : '+m+'€');return;}
  if(mise>br){sw('Mise supérieure à la bankroll.');return;}
  await updateDoc(sR,{['bankrolls.'+pid]:parseFloat((br-mise).toFixed(2))});
  await addDoc(pR,{playerId:pid,desc,cote,mise,isSanction:is,sanctionnerId:sId,status:'pending',date:TD(),createdAt:Date.now()});
  document.getElementById('s-desc').value='';document.getElementById('s-cote').value='';document.getElementById('s-mise').value='';
  document.getElementById('s-sanction').checked=false;document.getElementById('s-sanctionner-group').style.display='none';document.getElementById('s-mise-group').style.opacity='1';document.getElementById('s-coteinfo').style.display='none';w.style.display='none';
  toast('Pari déclaré pour '+gp(pid).name+' !');
}
window.declarerPari=dP;
async function rP(id,res){
  const p=paris.find(x=>x.id===id);if(!p)return;
  await updateDoc(doc(db,'paris',id),{status:res});
  if(p.isSanction){
    if(res==='won'){const gn=parseFloat((p.mise*(p.cote-1)).toFixed(2));await updateDoc(sR,{['bankrolls.'+p.playerId]:parseFloat((S.bankrolls[p.playerId]+p.mise).toFixed(2))});if(p.sanctionnerId){await updateDoc(sR,{['bankrolls.'+p.sanctionnerId]:parseFloat((S.bankrolls[p.sanctionnerId]+gn).toFixed(2))});toast('Gagné ! '+gp(p.sanctionnerId).name+' encaisse +'+gn+'€');}}
    else toast('Perdu. '+gp(p.playerId).name+' perd 5€.');
  }else{
    if(res==='won'){const gn=parseFloat((p.mise*(p.cote-1)).toFixed(2));await updateDoc(sR,{['bankrolls.'+p.playerId]:parseFloat((S.bankrolls[p.playerId]+p.mise+gn).toFixed(2))});toast('Gagné ! +'+gn+'€ net');}
    else toast('Perdu.');
  }
}
window.rP=rP;
async function sO(){
  const pid=document.getElementById('s-oubli').value,player=gp(pid),nc=(S.oublis[pid]||0)+1;
  await updateDoc(sR,{['oublis.'+pid]:nc});
  const autres=PL.filter(p=>p.id!==pid&&!eli(p.id)),tirage=autres[Math.floor(Math.random()*autres.length)];
  document.getElementById('modal-title').textContent='Sanction — '+player.name;
  document.getElementById('modal-body').textContent='Oubli n°'+nc+'. '+tirage.name+' est tiré au sort et choisit un pari de 5€ pour '+player.name+'.';
  document.getElementById('modal-box').style.display='block';
  document.getElementById('modal-box').innerHTML='<div>✅ Si gagné : '+player.name+' récupère sa mise · '+tirage.name+' encaisse les gains nets</div><div>❌ Si perdu : '+player.name+' perd 5€ · '+tirage.name+' ne perd rien</div>';
  document.getElementById('modal').classList.add('open');
}
window.signalerOubli=sO;
window.closeModal=()=>document.getElementById('modal').classList.remove('open');
window.switchTab=name=>{document.querySelectorAll('.tab').forEach((t,i)=>{const n=['dashboard','paris','saisir','historique'];t.classList.toggle('active',n[i]===name);});document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById('tab-'+name).classList.add('active');if(name==='saisir')ps();};
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2800);}
init();
</script>
